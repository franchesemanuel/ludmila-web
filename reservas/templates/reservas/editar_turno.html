{% extends "base.html" %}
{% block content %}

<section class="py-5 bg-light">
  <div class="container" style="max-width: 500px;">
    <div class="card shadow-sm rounded-4">
      <div class="card-body p-4">

        <h3 class="mb-4 text-center">Modificar turno</h3>

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input
              type="date"
              name="fecha"
              class="form-control"
              value="{{ turno.fecha|date:'Y-m-d' }}"
              required
            >
          </div>

          <div class="mb-3">
            <label class="form-label">Hora</label>
            <input
              type="time"
              name="hora"
              class="form-control"
              value="{{ turno.hora|time:'H:i' }}"
              required
            >
          </div>

          <div class="mb-4">
            <label class="form-label">Comentario</label>
            <textarea
              name="comentario"
              class="form-control"
              rows="3"
            >{{ turno.comentario }}</textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Guardar cambios
          </button>

        </form>

      </div>
    </div>
  </div>
</section>

{% endblock %}
