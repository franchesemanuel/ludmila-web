{% extends "base.html" %}
{% block content %}

<div class="container py-5" style="max-width: 500px;">
  <h2 class="mb-4 text-center">Crear cuenta</h2>

  {% for message in messages %}
    <div class="alert alert-warning text-center">{{ message }}</div>
  {% endfor %}

  <form method="post">
    {% csrf_token %}

    <!-- Nombre -->
    <div class="mb-3">
      <label class="form-label">Nombre completo</label>
      <input
        type="text"
        name="nombre"
        class="form-control"
        placeholder="Ej: Ludmila Salinas"
        required
      >
    </div>

    <!-- Teléfono -->
    <div class="mb-3">
      <label class="form-label">Teléfono</label>
      <input
        type="text"
        name="telefono"
        class="form-control"
        placeholder="Ej: 223335"
        required
      >
    </div>

    <!-- Contraseña -->
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input
        type="password"
        name="password1"
        class="form-control"
        placeholder="Ej: Pestanas123"
        required
      >
      <div class="form-text">
        Mínimo 8 caracteres, una mayúscula y un número.
      </div>
    </div>

    <!-- Repetir contraseña -->
    <div class="mb-4">
      <label class="form-label">Repetir contraseña</label>
      <input
        type="password"
        name="password2"
        class="form-control"
        placeholder="Repetí la contraseña"
        required
      >
    </div>

    <!-- Botón -->
    <button type="submit" class="btn btn-primary w-100">
      Crear cuenta
    </button>
  </form>
</div>

{% endblock %}
